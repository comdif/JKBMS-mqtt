mqtt:
  sensor:
    - name: JK BMS Total Voltage
      unique_id: jkbms_final_vtot
      state_topic: homeassistant/sensor/jkbms/state
      value_template: "{{ value_json.total_voltage | float(0) | round(3) }}"
      unit_of_measurement: V
      device_class: voltage
      state_class: measurement
