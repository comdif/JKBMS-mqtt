template:
  - sensor:
      - name: JK BMS Minimum Cell Voltage
        unique_id: jk_bms_minimum_cell_voltage
        state: >
          {{ [
            states('sensor.jk_bms_cell_01') | float(0),
            states('sensor.jk_bms_cell_02') | float(0),
            states('sensor.jk_bms_cell_03') | float(0),
            states('sensor.jk_bms_cell_04') | float(0),
            states('sensor.jk_bms_cell_05') | float(0),
            states('sensor.jk_bms_cell_06') | float(0),
            states('sensor.jk_bms_cell_07') | float(0),
            states('sensor.jk_bms_cell_08') | float(0),
            states('sensor.jk_bms_cell_09') | float(0),
            states('sensor.jk_bms_cell_10') | float(0),
            states('sensor.jk_bms_cell_11') | float(0),
            states('sensor.jk_bms_cell_12') | float(0),
            states('sensor.jk_bms_cell_13') | float(0),
            states('sensor.jk_bms_cell_14') | float(0),
            states('sensor.jk_bms_cell_15') | float(0),
            states('sensor.jk_bms_cell_16') | float(0)
          ] | min | round(3) }}
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
      - name: JK BMS Maximum Cell Voltage
        unique_id: jk_bms_maximum_cell_voltage
        state: >
          {{ [
            states('sensor.jk_bms_cell_01') | float(0),
            states('sensor.jk_bms_cell_02') | float(0),
            states('sensor.jk_bms_cell_03') | float(0),
            states('sensor.jk_bms_cell_04') | float(0),
            states('sensor.jk_bms_cell_05') | float(0),
            states('sensor.jk_bms_cell_06') | float(0),
            states('sensor.jk_bms_cell_07') | float(0),
            states('sensor.jk_bms_cell_08') | float(0),
            states('sensor.jk_bms_cell_09') | float(0),
            states('sensor.jk_bms_cell_10') | float(0),
            states('sensor.jk_bms_cell_11') | float(0),
            states('sensor.jk_bms_cell_12') | float(0),
            states('sensor.jk_bms_cell_13') | float(0),
            states('sensor.jk_bms_cell_14') | float(0),
            states('sensor.jk_bms_cell_15') | float(0),
            states('sensor.jk_bms_cell_16') | float(0)
          ] | max | round(3) }}
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
      - name: JK BMS Cell Voltage Delta
        unique_id: jk_bms_cell_voltage_delta
        state: >
          {% set c_min = states('sensor.jk_bms_minimum_cell_voltage') | float(0) %}
          {% set c_max = states('sensor.jk_bms_maximum_cell_voltage') | float(0) %}
          {{ ((c_max - c_min) * 1000) | round(0) }}
        unit_of_measurement: mV
        state_class: measurement
