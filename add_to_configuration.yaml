mqtt:
  sensor:
    - name: "JK BMS Total Voltage"
      unique_id: jkbms_total_voltage
      state_topic: "homeassistant/sensor/jk_bms/state"
      value_template: "{{ value_json.total_voltage | float(0) }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement

    - name: "JK BMS Current"
      unique_id: jkbms_current
      state_topic: "homeassistant/sensor/jk_bms/state"
      value_template: "{{ value_json.current | float(0) }}"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement

    - name: "JK BMS Power"
      unique_id: jkbms_power
      state_topic: "homeassistant/sensor/jk_bms/state"
      value_template: "{{ value_json.power | float(0) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement

    - name: "JK BMS State of Charge"
      unique_id: jkbms_soc
      state_topic: "homeassistant/sensor/jk_bms/state"
      value_template: "{{ value_json.soc | float(0) }}"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement

    - name: "JK BMS Capacity Remaining"
